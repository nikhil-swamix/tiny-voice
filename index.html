<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Tiny Voice</title></head><body><main id="panel"><header id="dragbar" title="Drag to move"><button id="orb" aria-label="Start recording"><img id="waveicon" alt=""></button><div class="brand"><div class="brand-copy"><b>Tiny Voice</b><small class="shortcut">Ctrl + Shift + Space</small></div></div><span id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><button id="turbo" title="Upgrade latest transcript to Pro" aria-label="Turbo: upgrade latest transcript to Pro" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z" fill="currentColor"/></svg><span>Turbo</span></button><nav><button id="minimize" aria-label="Mini view" title="Mini view">−</button><button id="hide" aria-label="Hide to tray" title="Hide to tray">×</button></nav></header><p id="status" role="status">Ready</p><p id="engine" role="status">Idle · no task assigned · mic off</p><div id="modes" role="group" aria-label="Output mode"><button data-mode="quick" aria-pressed="true" title="Clean speech into clear task notes">Quick</button><button data-mode="pro" aria-pressed="false" title="Expand tasks with steps and contextual tips">Pro</button></div><button id="record">Record</button><div id="text" class="transcript empty" role="region" aria-label="Rendered transcript" tabindex="0">Your words appear here…</div><small id="model" hidden aria-label="Provider model metadata"></small><div id="popover" class="transcript" aria-live="polite"></div><footer><button id="mic" disabled>Mic off</button><button id="folder">Audio folder</button></footer><span id="resize" title="Drag to resize" aria-label="Resize widget">◢</span></main><script type="module" src="/src/main.js"></script></body></html>
